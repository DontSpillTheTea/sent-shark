<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entailment Judge Playground</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #0969da;
      --accent-hover: #0550ae;
      --ok-bg: #dafbe1;
      --ok-text: #116329;
      --warn-bg: #fff8c5;
      --warn-text: #7d4e00;
      --err-bg: #ffebe9;
      --err-text: #cf222e;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
    }
    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .preset-btn {
      background: #f3f4f6;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .preset-btn:hover { background: #eaeef2; }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      min-height: 76px;
      padding: 10px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    button[type="submit"] {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button[type="submit"]:hover:not(:disabled) { background: var(--accent-hover); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }
    .endpoint-tag {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .metric {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .metric-label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .metric-value {
      font-family: var(--mono);
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 2px;
      word-break: break-all;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.9rem;
    }
    .badge-entails { background: var(--ok-bg); color: var(--ok-text); }
    .badge-neutral { background: var(--warn-bg); color: var(--warn-text); }
    .badge-error { background: var(--err-bg); color: var(--err-text); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    th, td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--muted);
      font-weight: 600;
      width: 210px;
    }
    td { font-family: var(--mono); word-break: break-all; }
    pre {
      margin: 12px 0 0;
      padding: 10px;
      background: #f6f8fa;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.85rem;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>Same-Language Entailment Judge</h1>
    <p class="subtitle">Developer playground calling <code>POST /judge</code> with live response headers and latency.</p>

    <section class="card">
      <div class="presets" id="presets" aria-label="Sample presets">
        <button type="button" class="preset-btn" data-preset="en-entail">EN Entail</button>
        <button type="button" class="preset-btn" data-preset="en-no-entail">EN No-Entail</button>
        <button type="button" class="preset-btn" data-preset="ja-entail">JA Entail</button>
        <button type="button" class="preset-btn" data-preset="ja-no-entail">JA No-Entail</button>
      </div>

      <form id="judge-form">
        <label for="sentence1">Sentence 1 (Premise)</label>
        <textarea id="sentence1" name="sentence1" required placeholder="Enter premise sentence..."></textarea>

        <label for="sentence2">Sentence 2 (Hypothesis)</label>
        <textarea id="sentence2" name="sentence2" required placeholder="Enter hypothesis sentence..."></textarea>

        <div class="actions">
          <button type="submit" id="submit-btn">Evaluate</button>
          <span class="endpoint-tag">POST /judge</span>
        </div>
      </form>
    </section>

    <section class="card" aria-live="polite">
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Label</div>
          <div class="metric-value" id="res-label">-</div>
        </div>
        <div class="metric">
          <div class="metric-label">Score</div>
          <div class="metric-value" id="res-score">-</div>
        </div>
        <div class="metric">
          <div class="metric-label">HTTP Status</div>
          <div class="metric-value" id="res-status">-</div>
        </div>
        <div class="metric">
          <div class="metric-label">Latency (ms)</div>
          <div class="metric-value" id="res-latency">-</div>
        </div>
      </div>

      <table>
        <tbody>
          <tr>
            <th>X-Request-Id</th>
            <td id="hdr-request-id">-</td>
          </tr>
          <tr>
            <th>X-RateLimit-Limit</th>
            <td id="hdr-ratelimit-limit">-</td>
          </tr>
          <tr>
            <th>X-RateLimit-Remaining</th>
            <td id="hdr-ratelimit-remaining">-</td>
          </tr>
          <tr>
            <th>Retry-After</th>
            <td id="hdr-retry-after">-</td>
          </tr>
        </tbody>
      </table>

      <pre id="res-raw">Submit a sentence pair to inspect the JSON response.</pre>
    </section>
  </main>

  <script>
    (function () {
      var PRESETS = {
        "en-entail": {
          sentence1: "A dog is running across the grassy field.",
          sentence2: "An animal is moving outdoors."
        },
        "en-no-entail": {
          sentence1: "A man is playing guitar on a quiet street.",
          sentence2: "A crowd is cheering at a rock concert."
        },
        "ja-entail": {
          sentence1: "少年が公園でサッカーボールを蹴っている。",
          sentence2: "子どもが外で遊んでいる。"
        },
        "ja-no-entail": {
          sentence1: "猫がソファの上で静かに眠っている。",
          sentence2: "犬が駅の前で走っている。"
        }
      };

      var form = document.getElementById("judge-form");
      var s1Input = document.getElementById("sentence1");
      var s2Input = document.getElementById("sentence2");
      var submitBtn = document.getElementById("submit-btn");

      var resLabel = document.getElementById("res-label");
      var resScore = document.getElementById("res-score");
      var resStatus = document.getElementById("res-status");
      var resLatency = document.getElementById("res-latency");
      var hdrRequestId = document.getElementById("hdr-request-id");
      var hdrRateLimit = document.getElementById("hdr-ratelimit-limit");
      var hdrRateRemaining = document.getElementById("hdr-ratelimit-remaining");
      var hdrRetryAfter = document.getElementById("hdr-retry-after");
      var resRaw = document.getElementById("res-raw");

      function getCookie(name) {
        var prefix = name + "=";
        var parts = document.cookie ? document.cookie.split(";") : [];
        for (var i = 0; i < parts.length; i += 1) {
          var item = parts[i].trim();
          if (item.indexOf(prefix) === 0) {
            return decodeURIComponent(item.slice(prefix.length));
          }
        }
        return "";
      }

      function setLabelBadge(labelText, badgeClass) {
        resLabel.textContent = "";
        var span = document.createElement("span");
        span.className = "badge " + badgeClass;
        span.textContent = labelText;
        resLabel.appendChild(span);
      }

      document.getElementById("presets").addEventListener("click", function (event) {
        var btn = event.target.closest("button[data-preset]");
        if (!btn) {
          return;
        }
        var sample = PRESETS[btn.getAttribute("data-preset")];
        if (!sample) {
          return;
        }
        s1Input.value = sample.sentence1;
        s2Input.value = sample.sentence2;
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        submitBtn.disabled = true;

        var headers = { "Content-Type": "application/json" };
        var csrfToken = getCookie("csrftoken");
        if (csrfToken) {
          headers["X-CSRFToken"] = csrfToken;
        }

        var startedAt = performance.now();
        try {
          var response = await fetch("/judge", {
            method: "POST",
            headers: headers,
            body: JSON.stringify({
              sentence1: s1Input.value,
              sentence2: s2Input.value
            })
          });
          var latencyMs = (performance.now() - startedAt).toFixed(2);
          var rawText = await response.text();
          var data = null;
          try {
            data = JSON.parse(rawText);
          } catch (_err) {
            data = null;
          }

          resStatus.textContent = String(response.status);
          resLatency.textContent = latencyMs + " ms";
          hdrRequestId.textContent = response.headers.get("X-Request-Id") || "-";
          hdrRateLimit.textContent = response.headers.get("X-RateLimit-Limit") || "-";
          hdrRateRemaining.textContent = response.headers.get("X-RateLimit-Remaining") || "-";
          hdrRetryAfter.textContent = response.headers.get("Retry-After") || "-";

          if (response.ok && data && typeof data.label === "string") {
            var badgeClass = data.label === "ENTAIL" ? "badge-entails" : "badge-neutral";
            setLabelBadge(data.label, badgeClass);
            resScore.textContent = typeof data.score === "number" ? data.score.toFixed(4) : String(data.score);
          } else {
            setLabelBadge("error", "badge-error");
            resScore.textContent = "-";
          }
          resRaw.textContent = data ? JSON.stringify(data, null, 2) : (rawText || "(empty body)");
        } catch (err) {
          var failedMs = (performance.now() - startedAt).toFixed(2);
          setLabelBadge("network_error", "badge-error");
          resScore.textContent = "-";
          resStatus.textContent = "ERR";
          resLatency.textContent = failedMs + " ms";
          hdrRequestId.textContent = "-";
          hdrRateLimit.textContent = "-";
          hdrRateRemaining.textContent = "-";
          hdrRetryAfter.textContent = "-";
          resRaw.textContent = err && err.message ? err.message : "Request failed";
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
