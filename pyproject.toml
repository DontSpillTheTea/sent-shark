[project]
name = "entailment-judge-api"
version = "0.1.0"
description = "Same-Language Entailment Judge API (Mantra Langaku Backend Coding Assignment - Option 3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.4",
    "djangorestframework>=3.16.0",
    "gunicorn>=23.0.0",
    "protobuf>=5.28.0",
    "psycopg[binary]>=3.2.0",
    "sentencepiece>=0.2.0",
    "torch>=2.4.0",
    "transformers>=4.46.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.36.0",
    "pytest>=8.4.1",
    "pytest-django>=4.11.1",
    "ruff>=0.12.7",
]

[tool.poe.env]
DJANGO_SETTINGS_MODULE = "assignment.settings"

[tool.poe.tasks]
lint = "ruff check --fix ."
format = "ruff format ."
test = "pytest"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["assignment/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
